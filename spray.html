<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spray preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; font: 13px/1.3 -apple-system, "Inter", sans-serif; }
    canvas { display: block; }
    .ui {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      padding: 8px; border-radius: 999px; background: rgba(28, 28, 30, .72); backdrop-filter: blur(14px);
      color: #f5f5f7; max-width: calc(100vw - 32px);
    }
    .ui button {
      border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer;
      background: #f5f5f7; color: #1d1d1f;
    }
    .ui button.ghost { background: transparent; color: #f5f5f7; box-shadow: inset 0 0 0 1px rgba(245,245,247,.35); }
    .ui input { width: 180px; accent-color: #d9b56c; }
    .ui label { display: flex; gap: 8px; align-items: center; padding: 0 6px; }
    .hint { position: fixed; top: 16px; left: 16px; color: rgba(245,245,247,.55); }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="hint">Мышь — вращать, колесо — приблизить</div>
  <div class="ui">
    <button id="spray">Пшик</button>
    <label>время <input id="time" type="range" min="0" max="2.8" step="0.01" value="0"></label>
    <button id="macro" class="ghost">Макро капли</button>
    <button id="bg" class="ghost">Светлый фон</button>
  </div>
  <script type="module" src="spray-demo.js"></script>
</body>
</html>
